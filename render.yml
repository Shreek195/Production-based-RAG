# render.yaml - Infrastructure as Code for Render
services:
  - type: web
    name: llm-guardrails-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT
        value: "20/minute"
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: MAX_RETRIES
        value: "3"
      - key: PRIMARY_MODEL
        value: gemini-3.6-flash
      - key: FALLBACK_MODEL
        value: gemini-3.6-flash   # Ideally a different model, so the fallback survives if the primary is down
      - key: GEMINI_API_KEY
        sync: false   # Must be set manually - NEVER commit secrets
      - key: LANGSMITH_API_KEY
        sync: false   # Must be set manually
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_PROJECT
        value: production-api
    healthCheckPath: /health
    autoDeploy: true